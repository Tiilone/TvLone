name: Personnalisations de la copie

# Propre à cette copie (Tiilone/TvLone), absent du dépôt d'origine. À chaque push sur main (donc à chaque
# « Sync fork ») : vérifie que les personnalisations de la copie sont toujours en place (tests/ma-copie.test.js).
# En échec, GitHub envoie un mail ; le nom du test qui échoue dit quelle personnalisation a sauté.
# (Cloudflare déploie de son côté sans attendre ce workflow.)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: copie-${{ github.ref }}
  cancel-in-progress: true

jobs:
  copie:
    name: Personnalisations en place
    if: github.repository == 'Tiilone/TvLone'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: node --import ./tests/support/register.mjs --test tests/ma-copie.test.js
